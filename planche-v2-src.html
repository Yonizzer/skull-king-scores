<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planche de scores Skull King, version 2</title>
<style>
@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: 210mm; height: 297mm; display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: 148.5mm 148.5mm; }
.sheet { padding: 7mm 6.5mm; overflow: hidden; display: flex; flex-direction: column; }
.sheet:nth-child(odd) { border-right: 0.2mm dashed #777; }
.sheet:nth-child(-n+2) { border-bottom: 0.2mm dashed #777; }
.grid { flex: 1; display: grid; grid-template-columns: 12mm repeat(4, 1fr); grid-template-rows: 8.5mm repeat(10, 1fr); border: 0.65mm solid #000; }
.grid > div { border-right: 0.65mm solid #000; border-bottom: 0.65mm solid #000; }
.grid > div:nth-child(5n) { border-right: 0; }
.grid > div:nth-last-child(-n+5) { border-bottom: 0; }
.corner { color: #000; display: grid; place-items: center; font-family: Georgia, serif; font-size: 9pt; font-weight: bold; color: #000; letter-spacing: .04em; }
.rn { display: grid; grid-template-rows: 45% 1fr; }
.rn b { display: grid; place-items: center; font-family: Georgia, serif; font-size: 11pt; line-height: 1; background: #111; color: #fff; }
.rn u { text-decoration: none; position: relative; }
.cell { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 45% 1fr; }
.cell i { border-right: 0.3mm solid #666; border-bottom: 0.45mm solid #000; }
.cell i:nth-child(3) { border-right: 0; background: #ededed; }
.cell u { grid-column: 1 / -1; position: relative; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
function sheet() {
  let g = '<div class="corner">SK</div>' + '<div></div>'.repeat(4);
  for (let r = 1; r <= 10; r++) g += '<div class="rn"><b>' + r + '</b><u></u></div>' + '<div class="cell"><i></i><i></i><i></i><u></u></div>'.repeat(4);
  return '<div class="sheet"><div class="grid">' + g + '</div></div>';
}
document.getElementById('page').innerHTML = sheet().repeat(4);
</script>
</body>
</html>
