<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planche de scores Skull King</title>
<style>
@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: 210mm; height: 297mm; display: flex; flex-direction: column; }
.sheet { height: 148.5mm; padding: 6mm 8mm 5mm; display: flex; flex-direction: column; }
.sheet + .sheet { border-top: 0.2mm dashed #777; }
.head { display: flex; align-items: baseline; justify-content: space-between; height: 7mm; }
.head .t { font-family: Georgia, "Times New Roman", serif; font-size: 13pt; font-weight: bold; letter-spacing: .04em; }
.head .d { font-size: 8pt; color: #333; }
.grid { display: grid; grid-template-columns: 11mm repeat(6, 1fr); border: 0.5mm solid #000; }
.grid > div { border-right: 0.5mm solid #000; border-bottom: 0.3mm solid #000; }
.grid > div:nth-child(7n) { border-right: 0; }
.name { height: 9mm; position: relative; }
.name span { position: absolute; left: 1mm; top: 0.6mm; font-size: 5.5pt; color: #555; text-transform: uppercase; letter-spacing: .06em; }
.lab { height: 3.6mm; display: grid; grid-template-columns: 9mm 7mm 1fr; font-size: 5pt; text-transform: uppercase; letter-spacing: .04em; color: #333; background: #e9e9e9; }
.lab i { font-style: normal; text-align: center; line-height: 3.3mm; border-right: 0.15mm solid #888; }
.lab i:last-child { border-right: 0; }
.rn { height: 10mm; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 13pt; font-weight: bold; line-height: 1; }
.rn small { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 4.6pt; font-weight: normal; color: #444; margin-top: 0.6mm; }
.cell { height: 10mm; display: grid; grid-template-columns: 9mm 7mm 1fr; }
.cell > b { border-right: 0.15mm solid #888; position: relative; font-weight: normal; }
.cell > b:last-child { border-right: 0; }
.cell svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tot { height: 9mm; }
.totl { height: 9mm; display: flex; align-items: center; justify-content: center; font-size: 6pt; font-weight: bold; text-transform: uppercase; letter-spacing: .04em; }
.grid > .last { border-bottom: 0; }
.legend { margin-top: 1.6mm; font-size: 6.2pt; line-height: 1.35; color: #111; }
.legend b { font-weight: bold; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
function sheet() {
  let g = '<div class="name"></div>';
  for (let p = 0; p < 6; p++) g += '<div class="name"><span>Joueur</span></div>';
  g += '<div class="lab"></div>';
  for (let p = 0; p < 6; p++) g += '<div class="lab"><i style="text-transform:none;letter-spacing:0;white-space:nowrap">pari/plis</i><i>bonus</i><i>total</i></div>';
  const diag = '<svg viewBox="0 0 10 10" preserveAspectRatio="none"><line x1="0" y1="10" x2="10" y2="0" stroke="#888" stroke-width="0.5" vector-effect="non-scaling-stroke"/></svg>';
  for (let r = 1; r <= 10; r++) {
    g += '<div class="rn">' + r + '<small>0 = ±' + (r * 10) + '</small></div>';
    for (let p = 0; p < 6; p++) g += '<div class="cell"><b>' + diag + '</b><b></b><b></b></div>';
  }
  g += '<div class="totl last">Final</div>';
  for (let p = 0; p < 6; p++) g += '<div class="tot last"></div>';
  return '<div class="sheet">' +
    '<div class="head"><span class="t">SKULL KING · SCORES</span><span class="d">Date : ______________</span></div>' +
    '<div class="grid">' + g + '</div>' +
    '<div class="legend"><b>Pari réussi :</b> 20 par pli parié. <b>Raté :</b> −10 par pli d\'écart. ' +
    '<b>Pari de 0 :</b> ±10 × la manche (rappelé sous chaque numéro). ' +
    '<b>Bonus si pari réussi :</b> 14 de couleur +10 · 14 noir +20 · sirène prise par un pirate +20 · pirate pris par le Skull King +30 · Skull King pris par une sirène +40 · butin +20. ' +
    'Case coupée : pari en haut à gauche, plis gagnés en bas à droite. Total = score cumulé.</div>' +
    '</div>';
}
document.getElementById('page').innerHTML = sheet() + sheet();
</script>
</body>
</html>
