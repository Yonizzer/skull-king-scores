<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planche de scores Skull King</title>
<style>
@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: Georgia, "Times New Roman", serif; color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: 210mm; height: 297mm; display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: 148.5mm 148.5mm; }
.sheet { padding: 7mm 6.5mm; overflow: hidden; }
.sheet:nth-child(odd) { border-right: 0.2mm dashed #777; }
.sheet:nth-child(-n+2) { border-bottom: 0.2mm dashed #777; }
.grid { height: 100%; display: grid; grid-template-columns: 12mm repeat(4, 1fr); grid-template-rows: 9.5mm repeat(10, 1fr); border: 0.65mm solid #000; }
.grid > div { border-right: 0.65mm solid #000; border-bottom: 0.65mm solid #000; }
.grid > div:nth-child(5n) { border-right: 0; }
.grid > div:nth-last-child(-n+5) { border-bottom: 0; }
.corner { background: #111; color: #fff; display: grid; place-items: center; font-size: 11pt; font-weight: bold; letter-spacing: .05em; }
.rn { display: flex; flex-direction: column; align-items: center; padding-top: 0.7mm; font-size: 10pt; line-height: 1; }
.rn::after { content: ""; width: 8mm; border-top: 0.25mm solid #000; margin-top: 0.4mm; }
.cell { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
.bid { grid-area: 1 / 1; position: relative; border-right: 0.45mm solid #000; border-bottom: 0.45mm solid #000; }
.bid svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.shade { grid-area: 2 / 1; background: #d9d9d9; border-right: 0.4mm dashed #000; }
.pts { grid-area: 1 / 2; border-right: 0.45mm solid #000; border-bottom: 0.4mm dashed #000; }
.bon { grid-area: 1 / 3; border-bottom: 0.4mm dashed #000; }
.tot { grid-area: 2 / 2 / 3 / 4; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
function sheet() {
  const diag = '<svg viewBox="0 0 10 10" preserveAspectRatio="none"><line x1="0" y1="10" x2="10" y2="0" stroke="#000" stroke-width="0.45mm" vector-effect="non-scaling-stroke"/></svg>';
  const cell = '<div class="cell"><div class="bid">' + diag + '</div><div class="shade"></div><div class="pts"></div><div class="bon"></div><div class="tot"></div></div>';
  let g = '<div class="corner">SK</div><div></div><div></div><div></div><div></div>';
  for (let r = 1; r <= 10; r++) g += '<div class="rn">' + r + '</div>' + cell.repeat(4);
  return '<div class="sheet"><div class="grid">' + g + '</div></div>';
}
document.getElementById('page').innerHTML = sheet().repeat(4);
</script>
</body>
</html>
