<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planche de scores Skull King</title>
<style>
@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: 210mm; height: 297mm; display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: 148.5mm 148.5mm; }
.sheet { padding: 6mm 6mm 4mm; display: flex; flex-direction: column; overflow: hidden; }
.sheet:nth-child(odd) { border-right: 0.2mm dashed #777; }
.sheet:nth-child(-n+2) { border-bottom: 0.2mm dashed #777; }
.head { display: flex; align-items: baseline; justify-content: space-between; height: 6mm; }
.head .t { font-family: Georgia, "Times New Roman", serif; font-size: 10pt; font-weight: bold; letter-spacing: .04em; }
.head .d { font-size: 6.5pt; color: #333; }
.grid { display: grid; grid-template-columns: 8mm repeat(6, 1fr); border: 0.4mm solid #000; }
.grid > div { border-right: 0.4mm solid #000; border-bottom: 0.3mm solid #000; }
.grid > div:nth-child(7n) { border-right: 0; }
.name { height: 8mm; position: relative; }
.name span { position: absolute; left: 0.7mm; top: 0.5mm; font-size: 4.2pt; color: #555; text-transform: uppercase; letter-spacing: .06em; }
.lab { height: 2.8mm; display: grid; grid-template-columns: repeat(3, 1fr); font-size: 3.6pt; color: #333; background: #e9e9e9; }
.lab i { font-style: normal; text-align: center; line-height: 2.5mm; border-right: 0.15mm solid #888; }
.lab i:last-child { border-right: 0; }
.rn { height: 10.6mm; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 12pt; font-weight: bold; line-height: 1; }
.rn small { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 4pt; font-weight: normal; color: #444; margin-top: 0.5mm; }
.cell { height: 10.6mm; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 4.4mm 1fr; }
.cell > b { border-right: 0.15mm solid #888; border-bottom: 0.15mm solid #888; }
.cell > b:nth-child(3) { border-right: 0; }
.cell > u { grid-column: 1 / -1; }
.tot { height: 8mm; }
.totl { height: 8mm; display: flex; align-items: center; justify-content: center; font-size: 5pt; font-weight: bold; text-transform: uppercase; }
.grid > .last { border-bottom: 0; }
.legend { margin-top: 1.2mm; font-size: 4.9pt; line-height: 1.3; color: #111; }
.legend b { font-weight: bold; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
function sheet() {
  let g = '<div class="name"></div>';
  for (let p = 0; p < 6; p++) g += '<div class="name"><span>Joueur</span></div>';
  g += '<div class="lab"></div>';
  for (let p = 0; p < 6; p++) g += '<div class="lab"><i>pari</i><i>plis</i><i>bonus</i></div>';
  for (let r = 1; r <= 10; r++) {
    g += '<div class="rn">' + r + '<small>0=±' + (r * 10) + '</small></div>';
    for (let p = 0; p < 6; p++) g += '<div class="cell"><b></b><b></b><b></b><u></u></div>';
  }
  g += '<div class="totl last">Final</div>';
  for (let p = 0; p < 6; p++) g += '<div class="tot last"></div>';
  return '<div class="sheet">' +
    '<div class="head"><span class="t">SKULL KING · SCORES</span><span class="d">Date : ____________</span></div>' +
    '<div class="grid">' + g + '</div>' +
    '<div class="legend"><b>Réussi :</b> 20 par pli parié. <b>Raté :</b> −10 par pli d\'écart. <b>Pari de 0 :</b> ±10 × la manche. ' +
    '<b>Bonus si réussi :</b> 14 couleur +10 · 14 noir +20 · sirène/pirate +20 · pirate/Skull King +30 · Skull King/sirène +40 · butin +20. ' +
    'Grande case : score cumulé.</div>' +
    '</div>';
}
document.getElementById('page').innerHTML = sheet() + sheet() + sheet() + sheet();
</script>
</body>
</html>
